<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 인라인 favicon — 외부 파일 요청(404)을 없애고 배포 경로에 의존하지 않게 한다. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 20,12 30,16 20,20 16,30 12,20 2,16 12,12' fill='%235fe3ff'/%3E%3C/svg%3E"
    />
    <title>Smashdem — 로그라이크 팽이 배틀 (12판 런)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d14;
        color: #d8dcea;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        height: 100%;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        gap: 12px;
        padding: 16px 0;
        box-sizing: border-box;
      }
      #game-shell {
        position: relative;
        width: min(960px, 100%);
      }
      #touch-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        width: min(960px, 100%);
        min-height: 124px;
        box-sizing: border-box;
        padding: 8px max(20px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        touch-action: none;
        user-select: none;
      }
      #touch-controls[hidden] {
        display: none;
      }
      #touch-move-zone,
      #touch-burst {
        width: 108px;
        height: 108px;
        box-sizing: border-box;
        border: 2px solid #4f5c83;
        border-radius: 50%;
        background: rgba(26, 34, 57, 0.94);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #touch-move-zone {
        position: relative;
        justify-self: start;
        box-shadow: inset 0 0 0 18px rgba(8, 12, 22, 0.3);
      }
      #touch-move-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        margin: -21px;
        border: 2px solid #9bd8ff;
        border-radius: 50%;
        box-sizing: border-box;
        background: rgba(87, 151, 211, 0.68);
        pointer-events: none;
        transform: translate(0px, 0px);
      }
      #touch-burst {
        justify-self: end;
        color: #fff6c7;
        border-color: #d69a43;
        background: #6b3528;
        font-size: 40px;
        line-height: 1;
      }
      #touch-burst:active {
        background: #9a4b31;
        transform: scale(0.94);
      }
      @media (pointer: fine) {
        #touch-controls {
          display: none !important;
        }
      }
      canvas {
        display: block;
        width: 100%;
        background: #0b0d14;
        border-radius: 8px;
        height: auto;
        touch-action: none;
      }
      #room-code-input {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translateX(-50%);
        box-sizing: border-box;
        width: min(240px, calc(100% - 40px));
        height: 38px;
        padding: 0 12px;
        border: 1px solid #6d79a5;
        border-radius: 4px;
        background: #141a2a;
        color: #edf2ff;
        font: 700 16px "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
      }
      #room-code-input:focus {
        outline: 2px solid #66c7f4;
        outline-offset: 2px;
      }
      .help {
        font-size: 13px;
        line-height: 1.7;
        opacity: 0.75;
        text-align: center;
      }
      kbd {
        background: #232839;
        border: 1px solid #3a4159;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-shell">
        <canvas id="game-canvas" width="960" height="620"></canvas>
        <input
          id="room-code-input"
          type="text"
          inputmode="text"
          maxlength="6"
          autocomplete="off"
          spellcheck="false"
          aria-label="온라인 대전 방 코드 6자리"
          placeholder="방 코드 6자리"
          hidden
        />
      </div>
      <div id="touch-controls" hidden>
        <div id="touch-move-zone" aria-label="이동 조작">
          <div id="touch-move-knob" aria-hidden="true"></div>
        </div>
        <button id="touch-burst" type="button" aria-label="버스트"><span aria-hidden="true">&#9889;</span></button>
      </div>
      <div class="help">
        상대를 밀어 회전력을 깎는 팽이 배틀 — <b>12판을 이기면 런 완주</b>. 승리마다 파츠 3택 1로 강해진다.<br />
        <kbd>← ↑ → ↓</kbd> / <kbd>W A S D</kbd> 이동 &nbsp;·&nbsp;
        <kbd>Space</kbd> 대시 버스트 &nbsp;·&nbsp; 보상·메뉴는 <b>클릭</b>(또는 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>)
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

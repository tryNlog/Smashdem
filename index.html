<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 인라인 favicon — 외부 파일 요청(404)을 없애고 배포 경로에 의존하지 않게 한다. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 20,12 30,16 20,20 16,30 12,20 2,16 12,12' fill='%235fe3ff'/%3E%3C/svg%3E"
    />
    <title>Smashdem — 로그라이크 팽이 배틀 (12판 런)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d14;
        color: #d8dcea;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        height: 100%;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        gap: 12px;
        padding: 16px 0;
        box-sizing: border-box;
      }
      #game-shell {
        position: relative;
        width: min(960px, 100%);
      }
      canvas {
        display: block;
        width: 100%;
        background: #0b0d14;
        border-radius: 8px;
        height: auto;
        touch-action: none;
      }
      #room-code-input {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translateX(-50%);
        box-sizing: border-box;
        width: min(240px, calc(100% - 40px));
        height: 38px;
        padding: 0 12px;
        border: 1px solid #6d79a5;
        border-radius: 4px;
        background: #141a2a;
        color: #edf2ff;
        font: 700 16px "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
      }
      #room-code-input:focus {
        outline: 2px solid #66c7f4;
        outline-offset: 2px;
      }
      .help {
        font-size: 13px;
        line-height: 1.7;
        opacity: 0.75;
        text-align: center;
      }
      kbd {
        background: #232839;
        border: 1px solid #3a4159;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-shell">
        <canvas id="game-canvas" width="960" height="620"></canvas>
        <input
          id="room-code-input"
          type="text"
          inputmode="text"
          maxlength="6"
          autocomplete="off"
          spellcheck="false"
          aria-label="온라인 대전 방 코드 6자리"
          placeholder="방 코드 6자리"
          hidden
        />
      </div>
      <div class="help">
        상대를 밀어 회전력을 깎는 팽이 배틀 — <b>12판을 이기면 런 완주</b>. 승리마다 파츠 3택 1로 강해진다.<br />
        <kbd>← ↑ → ↓</kbd> / <kbd>W A S D</kbd> 이동 &nbsp;·&nbsp;
        <kbd>Space</kbd> 대시 버스트 &nbsp;·&nbsp; 보상·메뉴는 <b>클릭</b>(또는 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>)
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
